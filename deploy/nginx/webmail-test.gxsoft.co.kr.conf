# Include this file from the nginx http {} context (for example, conf.d/).
# GXWebMail's Next.js server listens on 127.0.0.1:3034 and calls the
# TASTEMAIL API at 127.0.0.1:7531 itself. Never proxy the API to the browser.
map $http_upgrade $gxwebmail_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name webmail-test.gxsoft.co.kr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name webmail-test.gxsoft.co.kr;

    # Adjust these paths if the deployment uses a different certificate manager.
    ssl_certificate     /etc/letsencrypt/live/webmail-test.gxsoft.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail-test.gxsoft.co.kr/privkey.pem;

    # Keep this aligned with the permitted mail attachment size.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3034;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $gxwebmail_connection_upgrade;

        proxy_read_timeout 60s;
    }
}
